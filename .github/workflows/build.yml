# Caminho no repositório: .github/workflows/build.yml
#
# Compila o plugin (Java 21 + Gradle) e disponibiliza o .jar para download.
# Roda sozinho a cada push e também manualmente: aba Actions > "Build plugin" > Run workflow.

name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # O projeto não traz o gradle wrapper, então a própria action instala o Gradle.
      # cache-provider: basic = cache open source (o padrão do v6 usa um componente proprietário).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
          cache-provider: basic

      # Funciona com os arquivos na raiz do repositório ou dentro de uma pasta (ex.: ArtifactsSMP/).
      - name: Find project folder
        id: project
        run: |
          file=$(find . -maxdepth 2 -name build.gradle.kts | head -n 1)
          if [ -z "$file" ]; then
            echo "::error::build.gradle.kts not found. Upload src/, build.gradle.kts and settings.gradle.kts to the repo."
            exit 1
          fi
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: ArtifactsSMP-jar
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
